  comprehensive:  # Full embargo
    - RU  # Russia (sectoral)
    - IR  # Iran
    - KP  # North Korea
    - SY  # Syria
    - CU  # Cuba
    - VE  # Venezuela (partial)

  targeted:  # Entity-specific
    - BY  # Belarus
    - MM  # Myanmar
    - ZW  # Zimbabwe
    - SD  # Sudan
    - LB  # Lebanon (Hezbollah)
    - IQ  # Iraq (entities)

  shadow_fleet_flags:  # High risk for sanctions evasion
